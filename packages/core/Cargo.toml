[package]
name = "annado-core"
version = "0.1.0"
edition = "2021"
description = "Pure markdown task engine for Annado: parser, recurrence math, and ICS expansion. Compiles to native and wasm32-unknown-unknown."
license = "MIT"

[lib]
# rlib for native consumers (src-tauri / tests); cdylib for the wasm-bindgen build.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enables the #[wasm_bindgen] wrappers in src/wasm.rs and the JS-shaped deps.
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:getrandom"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# `wasmbind` makes chrono's Local/now work on wasm32 via js-sys (and is inert natively).
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
chrono-tz = "0.10.4"
rrule = "0.14.0"
sha2 = "0.10"
hex = "0.4"

# wasm-only dependencies, pulled in by the `wasm` feature.
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
# rrule/uuid pull in getrandom; on wasm it needs the `js` backend to find an RNG.
getrandom = { version = "0.2", features = ["js"], optional = true }

# wasm-pack tries to download the `binaryen` `wasm-opt` binary to shrink the
# `.wasm`. That download needs network access and isn't required for a correct
# build, so it's disabled here; size-optimization can be re-enabled in CI where
# binaryen is available (`wasm-opt = true`).
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
